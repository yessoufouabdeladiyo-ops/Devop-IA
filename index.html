    <!-- ============ Open Graph (partage réseaux sociaux) ============ -->

    <meta property="og:site_name" content="Abdel Sobou" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta
      property="og:title"
      content="Abdel Sobou — Développeur Web &amp; IA Freelance | Sites sur-mesure"

      property="og:description"
      content="Développeur web freelance spécialisé en IA et UX design. Sites vitrines, e-commerce, landing pages et applications web 100% sur-mesure, jamais de template."
    />

    <!-- ============ Twitter Card ============ -->

      name="twitter:title"
      content="Abdel Sobou — Développeur Web &amp; IA Freelance | Sites sur-mesure"

    <script>
      /* Applique langue + thème persistés AVANT le premier rendu (aucun flash)
         — <html lang> est aligné sur la langue active : fr (défaut) / en / ar */
      try {
        var l = window.localStorage.getItem("abdelsobou-lang");
        if (l === "AR") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        } else if (l === "EN") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        } else {
          document.documentElement.lang = "fr";
          document.documentElement.dir = "ltr";
        }
        var t = window.localStorage.getItem("abdelsobou-theme");
        if (
          t === "dark" ||
          (!t &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

  </body>
