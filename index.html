<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Abdel Sobou conçoit des sites 100 % sur-mesure — sites vitrines, e-commerce, landing pages, tunnels de vente et applications web — propulsés par l'IA et pensés pour l'expérience utilisateur. Zéro template, que du vrai."
    />
    <meta name="theme-color" content="#ff7c30" />
    <title>Abdel Sobou — Développeur Web Freelance · IA &amp; UX Design</title>
    <script>
      /* Applique langue + thème persistés AVANT le premier rendu (aucun flash) */
      try {
        var l = window.localStorage.getItem("abdelsobou-lang");
        if (l === "AR") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        } else if (l === "EN") {
          document.documentElement.lang = "en";
        }
        var t = window.localStorage.getItem("abdelsobou-theme");
        if (
          t === "dark" ||
          (!t &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
